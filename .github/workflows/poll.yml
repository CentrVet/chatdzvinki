name: Poll calls

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          PHONET_DOMAIN: ${{ secrets.PHONET_DOMAIN }}
          PHONET_API_KEY: ${{ secrets.PHONET_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_DURATION_SECONDS: "20"
          POLL_WINDOW_MINUTES: "60"
        run: python main.py

      - name: Commit processed.db
        run: |
          git config user.name "qc-bot"
          git config user.email "qc-bot@users.noreply.github.com"
          if [[ -n "$(git status --porcelain processed.db)" ]]; then
            git add processed.db
            git commit -m "state: update processed.db"
            git push
          else
            echo "no changes"
          fi
